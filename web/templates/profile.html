{% extends "base.html" %}
{% block title %}프로필 관리 — MatchWise{% endblock %}
{% block content %}
<h2>프로필 관리</h2>
<div class="card">
  <h3>{{ current_user.username }}</h3>
  <details>
    <summary>이력서 수정</summary>
    <form method="post" action="/profile/resume" style="margin-top:0.5rem;">
      <textarea name="resume_text" rows="10" placeholder="이력서 텍스트를 붙여넣으세요">{{ current_user.resume_text or '' }}</textarea>
      <button class="btn" type="submit">저장</button>
    </form>
  </details>
  <details>
    <summary>경험 텍스트 수정 (협업, 갈등 해결, 학창시절 등)</summary>
    <form method="post" action="/profile/experience" style="margin-top:0.5rem;">
      <textarea name="experience_text" rows="10" placeholder="자유 형식으로 경험을 작성하세요">{{ current_user.experience_text or '' }}</textarea>
      <button class="btn" type="submit">저장</button>
    </form>
  </details>
</div>
{% endblock %}
