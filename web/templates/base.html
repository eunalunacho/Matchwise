<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MatchWise{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; max-width: 1100px;
           margin: 0 auto; padding: 1rem; color: #1a1a1a; }
    nav { display: flex; gap: 1rem; margin-bottom: 1rem; }
    nav a { text-decoration: none; font-weight: 600; color: #4f46e5; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 0.5rem 0.75rem; border: 1px solid #e5e7eb; text-align: left; }
    th { background: #f9fafb; font-weight: 600; }
    tr:hover td { background: #f5f5ff; }
    .btn { display: inline-block; padding: 0.4rem 0.8rem;
           background: #4f46e5; color: white; border-radius: 4px;
           text-decoration: none; border: none; cursor: pointer; font-size: 0.85rem; }
    .btn.secondary { background: #6b7280; }
    .score-hi { color: #16a34a; font-weight: 700; }
    .score-md { color: #d97706; font-weight: 600; }
    .score-lo { color: #dc2626; }
    .tag { display: inline-block; background: #eef2ff; color: #4338ca;
           padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem;
           margin: 0.1rem; }
    .filters { margin-bottom: 1rem; }
    .filters a { margin-right: 0.5rem; font-size: 0.85rem; }
    .filters a.active { font-weight: 700; text-decoration: underline; }
    details { margin-top: 0.5rem; }
    summary { cursor: pointer; font-weight: 600; }
    textarea { width: 100%; font-family: monospace; }
    .card { border: 1px solid #e5e7eb; padding: 1rem; margin-bottom: 1.5rem; border-radius: 8px; }
  </style>
</head>
<body>
  {% if current_user %}
  <nav>
    <a href="/dashboard">대시보드</a>
    <a href="/profile">프로필 관리</a>
    <a href="/experiences">경험 조각 관리</a>
    <span style="margin-left:auto; color:#6b7280; font-size:0.85rem;">
      {{ current_user.username }}
      {%- if not current_user.discord_id %} · <a href="/connect/discord">Discord 연결</a>{% endif %}
      · <a href="/logout">로그아웃</a>
    </span>
  </nav>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
